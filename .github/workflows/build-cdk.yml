name: build-cdk

# Builds Ruby gems for the AWS CDK from *published npm artifacts* through
# stock jsii-pacmak with this plugin: naming arrives via the target-config
# profile (config/profile.json), no aws-cdk fork or assembly rebuild
# involved. Produces the gems as workflow artifacts, gated by a naming-sync
# check and a synth smoke test; with publish=true, pushes them to the public
# gem feed (rubygems.omarqureshi.net) and re-verifies by installing from it.
#
# NO immutability yet, deliberately: same-version gems overwrite in the feed
# while the pipeline is being iterated on ("mess-around mode"). Consumers
# with exact-pinned Gemfile.locks will see checksum mismatches on overwrite;
# a publish-once guard (with a force escape hatch) comes once the output is
# trusted.

on:
  workflow_dispatch:
    inputs:
      aws-cdk-lib-version:
        description: aws-cdk-lib version to build (an npm dist-tag or exact version)
        default: latest
      publish:
        description: publish the built gems to the public feed
        type: boolean
        default: false

# Publishing runs must not overlap the docs workflow (shared bucket + index);
# non-publishing runs get a unique group so they don't serialize.
concurrency:
  group: ${{ inputs.publish && 'gem-publish' || format('build-cdk-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Checkout the Ruby target
        uses: actions/checkout@v4
        with:
          repository: omarqureshi/jsii-target-ruby
          ref: main
          path: plugin

      - name: Bootstrap toolchain
        uses: omarqureshi/jsii-target-ruby/.github/actions/bootstrap-toolchain@main
        with:
          plugin-path: plugin

      - name: Install aws-cdk-lib@${{ inputs.aws-cdk-lib-version }} (published artifacts)
        id: install
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p cdk-build && cd cdk-build
          npm init -y > /dev/null
          npm install --save "aws-cdk-lib@${{ inputs.aws-cdk-lib-version }}" @jsii/runtime
          node -p "require('aws-cdk-lib/package.json').version" > VERSION
          echo "aws-cdk-lib $(cat VERSION)"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Naming-sync check (new submodules need a deliberate decision)
        run: |
          mkdir -p node_modules && ln -sfn "$PWD/plugin" node_modules/jsii-target-ruby
          AWS_CDK_LIB="${{ runner.temp }}/cdk-build/node_modules/aws-cdk-lib" node --test test/*.test.js

      # Shares the tablet with publish-docs: the translations are the same work,
      # and whichever workflow runs first pays for them.
      - name: Restore translation tablet
        id: tablet
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rosetta-tablet
          key: rosetta-ruby-tablet-${{ steps.install.outputs.version }}-${{ hashFiles('plugin/src/**', 'config/profile.json') }}
          restore-keys: |
            rosetta-ruby-tablet-${{ steps.install.outputs.version }}-
            rosetta-ruby-tablet-

      - name: Extract Ruby translations
        env:
          JSII_RUBY_TARGET_CONFIG: ${{ github.workspace }}/config/profile.json
          # Rosetta defaults to half the cores as workers; measured at ~3GB
          # each, which overruns a 16GB runner. Cap it: the extract is bounded
          # by memory here, not by cores.
          JSII_ROSETTA_MAX_WORKER_COUNT: '3'
        run: |
          cache_dir="${{ runner.temp }}/rosetta-tablet"
          mkdir -p "$cache_dir"
          cached="$cache_dir/ruby.tabl.json"
          node --max-old-space-size=8192 plugin/scripts/extract-tablet.js \
            "${{ runner.temp }}/cdk-build/node_modules/aws-cdk-lib" \
            "$cache_dir/next.tabl.json" \
            $([ -f "$cached" ] && echo "$cached")
          mv "$cache_dir/next.tabl.json" "$cached"
          echo "TABLET=$cached" >> "$GITHUB_ENV"

      - name: Keep the translation tablet
        # Saved here rather than by actions/cache's implicit post step, which is
        # skipped when the job fails — so a later failure discarded the ~2 hours
        # of translation this step exists to avoid repeating. The extract has
        # succeeded by this point, so the tablet is worth keeping whatever
        # happens next.
        if: always() && steps.tablet.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rosetta-tablet
          key: ${{ steps.tablet.outputs.cache-primary-key }}

      - name: Generate and build gems (single --recurse over the installed closure)
        env:
          JSII_RUBY_TARGET_CONFIG: ${{ github.workspace }}/config/profile.json
          # The feed publishes the closure atomically: every inter-gem
          # dependency is pinned to the exact version generated together.
          JSII_RUBY_PIN_DEPENDENCIES: exact
        run: |
          workdir="${{ runner.temp }}/cdk-build"
          # One --recurse run: this is the invocation every scaffolded plugin
          # pipeline should be able to use — no closure-ordering machinery of
          # its own. It exercises the D1 branch's pacmak fix (build order
          # ignores devDependencies; the published @aws-cdk/asset-* packages
          # devDepend on aws-cdk-lib, which used to deadlock the sort here),
          # so a regression fails this step before anything generates.
          # --rosetta-unknown-snippets=translate: without it rosetta returns
          # snippets verbatim while still labelling the fence with the target
          # language, so docs would claim Ruby and show TypeScript.
          node --max-old-space-size=8192 toolchain/jsii/packages/jsii-pacmak/bin/jsii-pacmak \
            --plugin "${GITHUB_WORKSPACE}/plugin" \
            -t ruby --force-target --recurse \
            --rosetta-tablet "$TABLET" \
            --rosetta-unknown-snippets=translate \
            -o "${workdir}/dist" "${workdir}/node_modules/aws-cdk-lib"
          # The runtime gem is not built here. It is the target's artifact,
          # published from jsii-target-ruby, and generated packages depend on
          # `jsii-ruby-runtime ~> 0.1` — a range — so they resolve whatever
          # compatible runtime is on the feed. Building it alongside would give
          # one artifact two publishers, and since `gem build` is not
          # byte-reproducible each would change the checksum the feed
          # advertises for a version already in people's lockfiles.
          ls -la "${workdir}/dist/ruby/"*.gem

      - name: Syntax-check every generated file
        run: |
          cd "${{ runner.temp }}/cdk-build/dist/ruby/lib"
          count=$(find . -name '*.rb' | wc -l)
          find . -name '*.rb' -print0 | xargs -0 -P "$(nproc)" -n 200 ruby -c > /dev/null
          echo "ruby -c: ${count} files clean"

      - name: Synth smoke test
        run: |
          workdir="${{ runner.temp }}/cdk-build"
          export GEM_HOME="${workdir}/gemhome"
          # The runtime comes from the feed, so this exercises the pairing a
          # consumer actually gets: these gems against the published runtime.
          # Installing one built in this same run would test a combination
          # nobody has.
          gem install jsii-ruby-runtime --no-document \
            --source https://rubygems.omarqureshi.net --source https://rubygems.org
          (cd "${workdir}/dist/ruby" && gem install --local --no-document ./*.gem)
          JSII_RUNTIME="${workdir}/node_modules/@jsii/runtime/bin/jsii-runtime" \
            ruby plugin/scripts/synth-smoke.rb

      - name: Upload gems
        uses: actions/upload-artifact@v4
        with:
          name: cdk-ruby-gems-${{ inputs.aws-cdk-lib-version }}
          path: ${{ runner.temp }}/cdk-build/dist/ruby/*.gem
          if-no-files-found: error

      - name: Configure AWS Credentials
        if: inputs.publish
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsCDKRole
          aws-region: us-east-1

      - name: Add the gems to the feed
        if: inputs.publish
        env:
          BUCKET: aws-cdk-ruby-gems
        run: |
          workdir="${{ runner.temp }}/cdk-build"

          # Add only. This repository does not own the feed's index, the
          # stylesheets or the CloudFront cache — those describe the whole feed,
          # and several repositories publish into it. Rebuilding an index from
          # one publisher's view of the bucket is a read-modify-write race: a
          # gem another publisher added between the read and the write silently
          # vanishes from the index while still sitting in the bucket. So the
          # gems go up and the owner is told; see the site's refresh workflow.
          # Never overwrite a published version. `gem build` is not
          # byte-reproducible, so re-uploading one changes the checksum the feed
          # advertises for it, and `bundle install` fails for anyone holding it
          # in a lockfile.
          #
          # This is routine rather than exceptional, because shared dependencies
          # appear in more than one closure: `constructs` is a dependency of
          # both aws-cdk-lib and cdk8s, so whichever repository publishes second
          # will already find its version there. Skipping is the correct
          # outcome, not a problem to report loudly.
          #
          # To republish a version deliberately, delete it first — the bucket is
          # versioned, so that is recoverable — or bump the version.
          added=0; skipped=0
          for gem_file in "${workdir}/dist/ruby/"*.gem; do
            key="gems/$(basename "$gem_file")"
            if aws s3api head-object --bucket "$BUCKET" --key "$key" >/dev/null 2>&1; then
              echo "  already published, leaving alone: $(basename "$gem_file")"
              skipped=$((skipped + 1))
              continue
            fi
            aws s3 cp "$gem_file" "s3://$BUCKET/$key" --no-progress >/dev/null
            echo "  added: $(basename "$gem_file")"
            added=$((added + 1))
          done
          echo "added $added gem(s), left $skipped already-published one(s) alone"

          # Provenance beside the gems: what was built, and from what.
          cdk_version=$(basename "${workdir}"/dist/ruby/aws-cdk-lib-*.gem .gem | sed 's/^aws-cdk-lib-//')
          manifest="${{ runner.temp }}/aws-cdk-lib-${cdk_version}.json"
          cat > "$manifest" << MANIFEST
          {
            "aws_cdk_lib": "${cdk_version}",
            "profile": "${{ github.sha }}",
            "jsii": "$(git -C toolchain/jsii rev-parse HEAD)",
            "jsii_rosetta": "$(git -C toolchain/jsii-rosetta rev-parse HEAD)",
            "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "built_at": "$(date -u +%FT%TZ)"
          }
          MANIFEST
          aws s3 cp "$manifest" "s3://$BUCKET/manifests/aws-cdk-lib-${cdk_version}.json" --no-progress >/dev/null

          # Every gem must be present before anything downstream is told it is —
          # whether this run added it or found it already there.
          for gem_file in "${workdir}/dist/ruby/"*.gem; do
            key="gems/$(basename "$gem_file")"
            aws s3api head-object --bucket "$BUCKET" --key "$key" >/dev/null \
              || { echo "::error::$key missing from s3://$BUCKET after upload"; exit 1; }
          done
          echo "CDK_VERSION=${cdk_version}" >> "$GITHUB_ENV"

      - name: Ask the site to reindex
        if: inputs.publish
        env:
          # A cross-repository dispatch needs a token with access to the other
          # repository; the default GITHUB_TOKEN is scoped to this one and
          # cannot do it. SITE_DISPATCH_TOKEN is a fine-grained PAT with
          # contents:write on rubygems.omarqureshi.net. Without it the site
          # picks the change up on its own schedule instead, so publishing
          # still completes — just not instantly.
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::no SITE_DISPATCH_TOKEN; the site will reindex on its schedule (within 20 minutes)"
            echo "DISPATCHED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if gh api -X POST repos/omarqureshi/rubygems.omarqureshi.net/dispatches \
               -f event_type=gems-published \
               -f client_payload[library]=aws-cdk-lib \
               -f client_payload[version]="$CDK_VERSION"; then
            echo "notified the site repository"
            echo "DISPATCHED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::dispatch failed; the site will reindex on its schedule"
            echo "DISPATCHED=false" >> "$GITHUB_ENV"
          fi

      - name: Wait for the feed to advertise the new version
        if: inputs.publish
        run: |
          # The gems are in the bucket; until the index is rebuilt they are not
          # advertised. That is the safe order — a gem present but unlisted is
          # invisible, a gem listed but absent is a broken install — but the
          # check below installs through CloudFront, so wait rather than race.
          #
          # Twenty-five minutes covers a scheduled reindex; a dispatched one
          # usually lands in under a minute.
          echo "waiting for aws-cdk-lib ${CDK_VERSION} (dispatched=${DISPATCHED})"
          for _ in $(seq 1 75); do
            if curl -fsS "https://rubygems.omarqureshi.net/info/aws-cdk-lib" 2>/dev/null \
                 | grep -q "^${CDK_VERSION} "; then
              echo "the feed advertises aws-cdk-lib ${CDK_VERSION}"
              exit 0
            fi
            sleep 20
          done
          echo "::error::the feed still does not advertise ${CDK_VERSION}"
          echo "run the site's refresh workflow, then re-run the verification below"
          exit 1

      - name: Verify by installing from the public feed
        if: inputs.publish
        run: |
          workdir="${{ runner.temp }}/cdk-build"
          verify="${{ runner.temp }}/feed-verify"
          mkdir -p "$verify" && cd "$verify"
          cdk_version=$(basename "${workdir}"/dist/ruby/aws-cdk-lib-*.gem .gem | sed 's/^aws-cdk-lib-//')
          cat > Gemfile << GEMFILE
          source 'https://rubygems.omarqureshi.net'
          gem 'aws-cdk-lib', '= ${cdk_version}'
          GEMFILE
          bundle install
          JSII_RUNTIME="${workdir}/node_modules/@jsii/runtime/bin/jsii-runtime" \
            bundle exec ruby "${GITHUB_WORKSPACE}/plugin/scripts/synth-smoke.rb"

      - name: Summary
        run: |
          workdir="${{ runner.temp }}/cdk-build"
          {
            echo "## CDK Ruby gems — built from published npm artifacts via \`--plugin\`"
            echo
            echo "| gem | size |"
            echo "| --- | --- |"
            for gem in "${workdir}/dist/ruby/"*.gem; do
              echo "| $(basename "$gem") | $(du -h "$gem" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
