name: publish-docs

# Builds the aws-cdk-lib Ruby API reference (single-registry YARD build +
# assembly-driven index, see docs-gen/README.md) and optionally publishes it
# to the public gem bucket under /docs.
#
# Supersedes the blog repo's publish-docs workflow: instead of downloading
# the published gem from the feed, this generates the bindings fresh through
# stock jsii-pacmak + this plugin, so the docs always match the current
# generator and naming config.
#
# The publish job needs AWS OIDC: the GitHubActionsCDKRole trust policy must
# include THIS repository's subject (note GitHub's immutable subject format
# for newer repos: repo:owner@id/repo@id) and the AWS_ACCOUNT_ID secret must
# be set in the production environment. Until then, run with publish=false
# and grab the site from the workflow artifact.

on:
  workflow_dispatch:
    inputs:
      aws-cdk-lib-version:
        description: aws-cdk-lib version to document (npm dist-tag or exact version)
        default: latest
      publish:
        description: sync the built site to the docs bucket (needs AWS OIDC wired for this repo)
        type: boolean
        default: false

concurrency:
  group: gem-publish
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Checkout the Ruby target
        uses: actions/checkout@v4
        with:
          repository: omarqureshi/jsii-target-ruby
          ref: main
          path: plugin

      - name: Checkout the documentation site
        uses: actions/checkout@v4
        with:
          repository: omarqureshi/rubygems.omarqureshi.net
          ref: main
          path: site

      - name: Bootstrap toolchain
        uses: omarqureshi/jsii-target-ruby/.github/actions/bootstrap-toolchain@main
        with:
          plugin-path: plugin

      - name: Install YARD + redcarpet + rouge
        run: gem install yard redcarpet rouge --no-document

      - name: Install aws-cdk-lib
        id: install
        run: |
          workdir="${{ runner.temp }}/docs-build"
          mkdir -p "$workdir" && cd "$workdir"
          npm init -y > /dev/null
          npm install --save "aws-cdk-lib@${{ inputs.aws-cdk-lib-version || 'latest' }}"
          echo "version=$(node -p "require('$workdir/node_modules/aws-cdk-lib/package.json').version")" >> "$GITHUB_OUTPUT"

      # Translating every aws-cdk-lib example takes over an hour. The tablet
      # makes that a one-off: rosetta reuses cached translations and only
      # retranslates snippets whose source or translator version changed, so a
      # rebuild of an unchanged library does no translation at all.
      - name: Restore translation tablet
        id: tablet
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rosetta-tablet
          key: rosetta-ruby-tablet-${{ steps.install.outputs.version }}-${{ hashFiles('plugin/src/**', 'config/profile.json') }}
          restore-keys: |
            rosetta-ruby-tablet-${{ steps.install.outputs.version }}-
            rosetta-ruby-tablet-

      - name: Extract Ruby translations
        env:
          JSII_RUBY_TARGET_CONFIG: ${{ github.workspace }}/config/profile.json
          # Rosetta defaults to half the cores as workers; measured at ~3GB
          # each, which overruns a 16GB runner. Cap it: the extract is bounded
          # by memory here, not by cores.
          JSII_ROSETTA_MAX_WORKER_COUNT: '3'
        run: |
          workdir="${{ runner.temp }}/docs-build"
          cache_dir="${{ runner.temp }}/rosetta-tablet"
          mkdir -p "$cache_dir"
          cached="$cache_dir/ruby.tabl.json"
          # Extract reads the previous tablet and writes the new one beside it;
          # writing in place would lose the cache if the run failed part-way.
          node --max-old-space-size=8192 "${GITHUB_WORKSPACE}/plugin/scripts/extract-tablet.js" \
            "$workdir/node_modules/aws-cdk-lib" "$cache_dir/next.tabl.json" \
            $([ -f "$cached" ] && echo "$cached")
          mv "$cache_dir/next.tabl.json" "$cached"
          echo "TABLET=$cached" >> "$GITHUB_ENV"

      - name: Keep the translation tablet
        # See build-cdk: actions/cache's implicit save is skipped when a job
        # fails, discarding the hours of translation this cache exists for.
        if: always() && steps.tablet.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rosetta-tablet
          key: ${{ steps.tablet.outputs.cache-primary-key }}

      - name: Generate aws-cdk-lib Ruby sources
        env:
          JSII_RUBY_TARGET_CONFIG: ${{ github.workspace }}/config/profile.json
        run: |
          workdir="${{ runner.temp }}/docs-build"
          cd "$workdir"
          # --rosetta-unknown-snippets=translate: a snippet missing from the
          # tablet would otherwise come back verbatim while still being
          # labelled Ruby, so the docs would claim Ruby and show TypeScript.
          node --max-old-space-size=8192 "${GITHUB_WORKSPACE}/toolchain/jsii/packages/jsii-pacmak/bin/jsii-pacmak" \
            --plugin "${GITHUB_WORKSPACE}/plugin" \
            -t ruby --code-only --force-target \
            --rosetta-tablet "$TABLET" \
            --rosetta-unknown-snippets=translate \
            -o dist node_modules/aws-cdk-lib
          # The docs index/landing generators read Ruby naming from the
          # assembly, and the published assembly carries none (that's what
          # the overlay is for) — hand them the overlay-merged form. The
          # script refuses to write an assembly with zero submodule names,
          # so a broken overlay fails here instead of publishing an empty
          # module list.
          node "${GITHUB_WORKSPACE}/plugin/scripts/effective-assembly.js" \
            node_modules/aws-cdk-lib "$workdir/effective.jsii.gz"
          echo "GEM_LIB=$workdir/dist/ruby/lib/aws-cdk-lib" >> "$GITHUB_ENV"
          echo "ASSEMBLY=$workdir/effective.jsii.gz" >> "$GITHUB_ENV"

      - name: Build docs site
        run: |
          OUT="${{ runner.temp }}/docs-site"
          rm -rf "$OUT" && mkdir -p "$OUT"
          bash site/docs-gen/build-module-docs.sh "$GEM_LIB" "$OUT"
          ruby site/docs-gen/gen-module-landing.rb "$ASSEMBLY" "$OUT" config/profile.json
          ruby site/docs-gen/inject-crumb.rb "$OUT"
          # Statics are read as constants (Jsii::StaticConstants); YARD lists
          # them as the singleton methods they are defined as. Show the
          # spelling the docs actually teach.
          ruby plugin/docs-gen/constantize-static-reads.rb "$OUT"
          ruby site/docs-gen/gen-index.rb "$ASSEMBLY" "$OUT" config/profile.json
          echo "DOCS_OUT=$OUT" >> "$GITHUB_ENV"
          # Ask the same derivation the generators use rather than naming
          # AWSCDK here — and let it fail the build, because a docs tree with
          # no identifiable root module is one that would publish empty.
          ROOT=$(ruby -Isite/docs-gen -rroot_module -e 'print DocsRoot.detect(ARGV[0])' "$OUT")
          echo "built $(find "$OUT/$ROOT" -maxdepth 1 -type d | wc -l) module dirs under $ROOT"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdk-ruby-docs
          path: ${{ runner.temp }}/docs-site
          if-no-files-found: error

      - name: Configure AWS Credentials
        if: inputs.publish
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsCDKRole
          aws-region: us-east-1

      - name: Publish to this version's own prefix
        if: inputs.publish
        env:
          BUCKET: aws-cdk-ruby-gems
          VERSION: ${{ steps.install.outputs.version }}
        run: |
          # Each library publishes under docs/<Library>/<version>/ and writes
          # nowhere else. Two rules, both load-bearing:
          #
          #   no --delete   the destination is shared with every other library.
          #                 --delete removes whatever is absent from *this*
          #                 source, which is all of them.
          #
          #   versioned     the prefix is immutable once written, so rebuilding
          #                 an old version cannot disturb a newer one, and a
          #                 reader who pinned a gem can read the matching docs.
          #
          # Published whole, exactly as YARD built it: a class page links its
          # stylesheet as `../css/style.css`, so the module tree and the assets
          # beside it are one unit. Flattening the library level out would break
          # every asset link across ~20k pages. So the deep URL carries the
          # library name twice — docs/AWSCDK/2.263.0/AWSCDK/S3/Bucket.html —
          # which nobody types, because the alias lands on this version's own
          # index.html and that redirects inwards.
          ROOT=$(ruby -Isite/docs-gen -rroot_module -e 'print DocsRoot.detect(ARGV[0])' "$DOCS_OUT")
          DEST="s3://$BUCKET/docs/$ROOT/$VERSION/"
          echo "publishing $ROOT $VERSION -> $DEST"
          aws s3 sync "$DOCS_OUT" "$DEST" --no-progress
          echo "published $(aws s3 ls "$DEST" --recursive | wc -l) objects"

      - name: Ask the site to refresh its aliases and caches
        if: inputs.publish
        env:
          # Cross-repository dispatch needs a token with access to the site;
          # the default GITHUB_TOKEN is scoped to this repository and cannot do
          # it. Without SITE_DISPATCH_TOKEN the site picks the change up on its
          # own schedule, so publishing still completes — just not instantly.
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          VERSION: ${{ steps.install.outputs.version }}
        run: |
          # The bare docs/<Library>/ alias and the CloudFront invalidation are
          # shared state, owned by the site repository. A publisher only knows
          # about itself, so it cannot decide which version is newest — it says
          # what it published and lets the owner recompute.
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::no SITE_DISPATCH_TOKEN; the site will refresh on its schedule"
            exit 0
          fi
          gh api -X POST repos/omarqureshi/rubygems.omarqureshi.net/dispatches \
            -f event_type=docs-published \
            -f client_payload[library]=AWSCDK \
            -f client_payload[version]="$VERSION" \
            && echo "notified the site repository" \
            || echo "::warning::could not notify the site; run its refresh workflow by hand"
